services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: openlex
      POSTGRES_PASSWORD: openlex
      POSTGRES_DB: openlex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/postgres/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql
      - ./migrations/postgres/0002_users.sql:/docker-entrypoint-initdb.d/0002_users.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlex"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Isolated Postgres for tests/integration (see tests/integration/conftest.py). Separate from
  # `db` so integration tests never touch dev data, on a different host port (5544) so both can
  # run at once. Gated behind the `test` profile so `docker compose up` (dev stack) never starts
  # it. tmpfs data dir: test data is meant to be thrown away, and it's faster than disk.
  db-test:
    image: pgvector/pgvector:pg16
    profiles: ["test"]
    environment:
      POSTGRES_USER: openlex_test
      POSTGRES_DB: openlex_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5544:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./migrations/postgres/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql
      - ./migrations/postgres/0002_users.sql:/docker-entrypoint-initdb.d/0002_users.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlex_test -d openlex_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/repo
      - api_venv:/repo/.venv

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/repo
      - worker_venv:/repo/.venv

  web:
    build: ./apps/web
    env_file: .env
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules

volumes:
  pgdata:
  api_venv:
  worker_venv:
