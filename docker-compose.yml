services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: openlex
      POSTGRES_PASSWORD: openlex
      POSTGRES_DB: openlex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlex"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Isolated Postgres for tests/integration (see tests/integration/conftest.py). Separate from
  # `db` so integration tests never touch dev data, on a different host port (5544) so both can
  # run at once. Gated behind the `test` profile so `docker compose up` (dev stack) never starts
  # it. tmpfs data dir: test data is meant to be thrown away, and it's faster than disk.
  db-test:
    image: pgvector/pgvector:pg16
    profiles: ["test"]
    environment:
      POSTGRES_USER: openlex_test
      POSTGRES_DB: openlex_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5544:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./migrations/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlex_test -d openlex_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/repo
      - api_venv:/repo/.venv

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/repo
      - worker_venv:/repo/.venv

  web:
    build: ./apps/web
    env_file: .env
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules

  otel-collector:
    image: otel/opentelemetry-collector:0.156.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/local-observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v3.13.1
    volumes:
      - ./infra/local-observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      # Editor (not Viewer): Explore + the Traces/Logs/Metrics/Profiles drill-downs are gated
      # behind Editor, so Viewer would show a reduced nav. Consistent with the kind Grafana
      # (infra/argocd/apps/kind/app-kube-prometheus-stack.yaml's grafana.ini auth.anonymous).
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Editor
      # Stable admin password from .env (defaults to "admin" if unset), consistent with the
      # kind Grafana's grafana-admin secret. Anonymous access works without login regardless.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/local-observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./infra/local-observability/grafana-dashboards-provider.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

volumes:
  pgdata:
  api_venv:
  worker_venv:
