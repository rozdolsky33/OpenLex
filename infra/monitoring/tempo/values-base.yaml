# infra/monitoring/tempo/values-base.yaml
#
# Shared base values for Tempo, consumed by both the kind Application and any future
# eks-demo Application. This chart (grafana/tempo, not grafana/tempo-distributed) is
# single-binary by design ("Grafana Tempo Single Binary Mode" per its own chart
# description) — no config is needed to select that mode; it's the only mode this chart
# offers. Local filesystem storage under a dedicated PersistentVolumeClaim (`persistence.
# enabled: true` below) rather than the chart's default emptyDir — this is still a
# comparison-and-learning setup on kind (see the design doc), not a production-shaped
# deployment with S3/GCS-backed object storage, but an emptyDir shares the node's root
# filesystem with every other pod on it and does not survive a pod restart. Confirmed live:
# with the chart default, Tempo silently lost all ingested trace data on every pod restart
# during this project's own observability work, and repeated `"failed to cut traces...
# no space left on device"` errors once the shared node disk filled up from unrelated
# activity (image builds, other pods) -- switching to a PVC doesn't grow the underlying node
# disk (kind's default `rancher.io/local-path` provisioner doesn't enforce the `size` request
# as a hard quota, it just creates a directory on the node), but it does give Tempo durable
# storage across restarts and a named, capped, monitorable volume instead of silently
# competing with everything else for the node's root filesystem -- same reasoning `loki`
# (`infra/monitoring/loki/values-base.yaml`) already uses `singleBinary.persistence.enabled:
# true` for, and the same `size: 10Gi` convention, no `storageClassName` override needed since
# kind's default `standard` StorageClass (`rancher.io/local-path`) binds automatically.
#
# Verified against `helm show values grafana/tempo --version 1.24.*` (resolved to chart
# 1.24.4, appVersion 2.9.0) — this pinned version's schema differs materially from the task
# brief's sketch, which assumed a top-level `traces: {otlp: {grpc: {enabled: ...}}}` block and
# a top-level `storage.trace.backend` key. Neither exists in this chart. The real schema
# nests both under `tempo.*`:
#   - `tempo.receivers.otlp.protocols.{grpc,http}` — OTLP receivers are enabled by *presence*
#     in this map (there's no separate enabled/disabled toggle), and grpc :4317 / http :4318
#     are already the chart default. Kept here explicit rather than relying on the implicit
#     default, since Task 4 (OTel Collector dual export) depends on this exact endpoint.
#   - `tempo.storage.trace.backend: local` (with `local.path` / `wal.path` under
#     `/var/tempo/...`) is also already the chart default — restated here as a confirmation,
#     not an override.
# `resources` for the tempo container lives under `tempo.resources` in this chart (there is no
# top-level `resources` key) — the ArgoCD Application's valuesObject and the direct `helm`
# install both set it at that path, not at the top level.
#
# NOTE: as of chart 1.24.4, `helm upgrade` prints `this chart is deprecated` and
# `helm show chart` confirms `deprecated: true` upstream. Re-evaluate `grafana/tempo-
# distributed` or whatever the current Grafana-recommended Tempo deployment path is before
# hardening this beyond kind (see the design doc's kind/eks-demo consistency section).

persistence:
  enabled: true
  size: 10Gi

tempo:
  memBallastSizeMbs: 128
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  # Off by chart default (metricsGenerator.enabled: false) -- without it, Grafana's Tempo
  # datasource "Service Graph" tab and any TraceQL metrics query (rate()/histogram_over_time())
  # fail with "error finding generators: empty ring", because there's no metrics-generator
  # instance to ever register in the ring, confirmed live. Enabling it makes Tempo derive
  # service-graph and span-metrics series from ingested traces and remote_write them to
  # Prometheus (which needs prometheusSpec.enableRemoteWriteReceiver: true -- see
  # infra/monitoring/kube-prometheus-stack/values-base.yaml).
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/write"
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
          # service-graphs/span-metrics alone still leaves ad-hoc TraceQL metrics queries
          # (Grafana's Traces panel `| rate()`/`| quantile_over_time()` syntax, which calls
          # Tempo's query_range API) failing with "localblocks processor not found" --
          # confirmed live, a distinct error from "empty ring" above. That query path is
          # specifically served by the local-blocks processor, not the other two.
          - local-blocks
