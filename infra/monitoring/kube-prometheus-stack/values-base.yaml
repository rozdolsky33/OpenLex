# infra/monitoring/kube-prometheus-stack/values-base.yaml
#
# Shared base values for kube-prometheus-stack, consumed by both the kind Application
# (infra/argocd/apps/kind/app-kube-prometheus-stack.yaml) and any future eks-demo
# Application, via ArgoCD's multi-source `$values` reference. Environment-specific overrides
# (resource sizing, storage) live in each Application's own inline `valuesObject`, not here —
# see the design doc's "Local kind vs EKS-demo consistency" section.

grafana:
  # Default kube-prometheus-stack dashboards are vendored under
  # infra/monitoring/grafana/dashboards so they can be grouped into purpose-built
  # Grafana folders instead of all landing in General.
  defaultDashboardsEnabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        allowUiUpdates: false
        foldersFromFilesStructure: true
    # grafana.sidecar.resources is a single key shared by every k8s-sidecar container the
    # grafana subchart renders (dashboards + datasources here; see charts/grafana/templates/
    # _pod.tpl, every sidecar container block reads .Values.sidecar.resources) — not
    # per-sidecar. Environment-agnostic: these are small polling helper processes, not
    # something kind vs. eks-demo should size differently.
    #
    # 64Mi (the original limit) was too low in practice: both grafana-sc-dashboard and
    # grafana-sc-datasources were OOMKilled (exitCode 137) on every start, which left the
    # Grafana pod stuck at 1/3 Ready/CrashLoopBackOff and meant no dashboards/datasources
    # ever synced in (see Task 7's verification report). These sidecars run with
    # searchNamespace: ALL, which means k8s-sidecar list-watches ConfigMaps across every
    # namespace in the cluster (not just the 29 grafana_dashboard=1-labeled ones) to find
    # the ones it cares about — with ArgoCD/cert-manager/etc. also in this cluster, that
    # working set exceeded 64Mi. Bumped to 256Mi limit / 64Mi request; confirmed empirically
    # post-upgrade that restart counts stop climbing (see Task 7 follow-up report).
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 50m, memory: 256Mi }

alertmanager:
  enabled: true
  # No custom config.{} override here -- the chart's own default Alertmanager config already
  # routes every alert with no more-specific match to a "null" receiver (verified live via
  # `helm template`: route.receiver: "null", the top-level default), which is exactly what
  # the design doc calls for this pass ("page* routed to a null/log receiver for now --
  # visible in the Alertmanager UI, structured so a real Slack/PagerDuty receiver can be
  # swapped in later without touching rule definitions"). Nothing to add until a real
  # receiver is wired up.

# GA readiness checklist item 3.11 -- the five symptom-based alerts sketched in
# docs/superpowers/specs/2026-07-12-production-observability-design.md's "Golden-signal SLOs
# and alerting" section. additionalPrometheusRulesMap (not a standalone PrometheusRule
# manifest applied via kustomize, unlike the dashboard ConfigMaps) specifically so the
# generated PrometheusRule carries this chart's own release label automatically --
# ruleSelectorNilUsesHelmValues defaults to true (verified via `helm show values`), meaning
# Prometheus only watches PrometheusRules matching that label; a rule applied outside this
# values-driven mechanism would need the same ruleSelector: {} override this file already
# needed for ServiceMonitors, and this avoids that extra surface entirely.
#
# All five thresholds are explicit initial guesses, not derived from real production traffic
# -- same honesty as the design doc's own SLO targets. Revisit once there's real usage data.
# Every expression was live-verified against this cluster's actual running Prometheus before
# being committed (not just assumed to parse).
additionalPrometheusRulesMap:
  openlex-symptom-alerts:
    groups:
      - name: openlex.rules
        rules:
          - alert: HighErrorRate
            expr: |
              sum(rate(openlex_http_requests_total{route=~"/query|/auth.*",status_class="5xx"}[5m]))
              / sum(rate(openlex_http_requests_total{route=~"/query|/auth.*"}[5m])) > 0.05
            for: 2m
            labels:
              severity: page
            annotations:
              summary: "OpenLex /query+/auth error rate above 5%"
              description: "{{ $value | humanizePercentage }} of /query and /auth.* requests have failed (5xx) over the last 5m."
          - alert: ElevatedErrorRate
            expr: |
              sum(rate(openlex_http_requests_total{route=~"/query|/auth.*",status_class="5xx"}[15m]))
              / sum(rate(openlex_http_requests_total{route=~"/query|/auth.*"}[15m])) > 0.01
            for: 15m
            labels:
              severity: ticket
            annotations:
              summary: "OpenLex /query+/auth error rate above 1%"
              description: "{{ $value | humanizePercentage }} of /query and /auth.* requests have failed (5xx) over the last 15m."
          - alert: QueryLatencyP99High
            expr: |
              histogram_quantile(0.99, sum by (le) (rate(openlex_http_request_duration_seconds_bucket{route="/query"}[5m]))) > 6
            for: 10m
            labels:
              severity: ticket
            annotations:
              summary: "OpenLex /query p99 latency above 6s"
              description: "/query p99 latency has been above 6s for 10m (current: {{ $value | humanizeDuration }})."
          - alert: QuotaBurnRate
            expr: |
              sum by (tier) (increase(openlex_query_quota_exceeded_total[15m])) > 5
            labels:
              severity: ticket
            annotations:
              summary: "OpenLex tier {{ $labels.tier }} hitting its quota repeatedly"
              description: "{{ $value }} requests were rejected for quota exhaustion on tier {{ $labels.tier }} in the last 15m."
          - alert: PostgresConnectionSaturation
            expr: |
              sum(pg_stat_database_numbackends) / pg_settings_max_connections > 0.8
            for: 5m
            labels:
              severity: ticket
            annotations:
              summary: "Postgres connection count near max_connections"
              description: "Postgres is using {{ $value | humanizePercentage }} of max_connections for 5m."

prometheus:
  prometheusSpec:
    # Without these two, Prometheus only selects ServiceMonitors/PodMonitors carrying this
    # chart's own release label — openlex-api's ServiceMonitor (Task 5, a different
    # namespace, no such label) would silently never be scraped.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    # Tempo's metrics-generator (infra/monitoring/tempo/values-base.yaml) pushes
    # service-graph/span-metrics via Prometheus remote_write — that endpoint
    # (/api/v1/write) is disabled by default (--web.enable-remote-write-receiver), so without
    # this Tempo's writes would 404/501 and Grafana's TraceQL metrics queries (the Traces
    # panel's "rate()" queries, service graph) would keep failing with "empty ring" (no
    # generator ever successfully writes, though the deeper cause of that specific error was
    # metrics-generator not being enabled at all -- see tempo's values file).
    enableRemoteWriteReceiver: true
    # Previously no storageSpec at all -- Prometheus's TSDB lived on emptyDir (wiped on every
    # pod restart/reschedule) and each per-app Application additionally capped `retention: 6h`
    # on top of that, so metrics/counters routinely appeared to "expire" well within a single
    # day. The two settings were linked: 6h was chosen specifically because emptyDir shares the
    # node's root filesystem with every other pod on it (the same "no space left on device"
    # failure mode already hit and fixed for Tempo -- see tempo/values-base.yaml's header
    # comment), so an unbounded retention on unbounded shared disk was never safe. Fixed the
    # actual cause instead of just the symptom: a dedicated, capped PVC (same 10Gi convention
    # as Tempo/Loki, same no-storageClassName-override reliance on each cluster's default
    # StorageClass), which is what makes a longer retention safe to set at all now.
    #
    # This is a StatefulSet-embedded volumeClaimTemplate (Prometheus Operator generates the
    # Prometheus StatefulSet with this as its own volumeClaimTemplates entry), not a standalone
    # top-level PVC object -- unlike the Grafana PVC that deadlocked against ArgoCD's
    # PVC-must-be-Bound-before-Deployment-rolls health gate on eks-demo's WaitForFirstConsumer
    # gp3 StorageClass (see docs/postmortems/2026-07-16-eks-apps-node-capacity-and-grafana-pvc-
    # deadlock.md), the StatefulSet controller itself creates pod and PVC together, so
    # WaitForFirstConsumer binds against a pod the same reconcile is already creating rather
    # than one gated behind a separate, blocked sync step. Expected to avoid that deadlock
    # class, but -- per this project's own "verify against the live resource, not the
    # assumption" lesson from that exact postmortem -- confirm the PVC actually reaches Bound
    # on both clusters after this syncs, don't just trust the reasoning here.
    retention: 15d
    # Hard size-based cap so Prometheus prunes old blocks by size if 15d of real data would
    # ever exceed the PVC before the time-based retention does -- whichever limit is hit
    # first wins. Set below the 10Gi PVC size, not equal to it, so Prometheus has headroom to
    # compact/write new blocks without racing against a completely full volume.
    retentionSize: "9GB"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

prometheusOperator:
  # Prometheus Operator's own container resources — the operator control-loop process
  # itself, distinct from the Prometheus/Alertmanager instances it manages.
  # Environment-agnostic: same small control-plane process regardless of kind vs. eks-demo.
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }
  prometheusConfigReloader:
    # Not a container resources field directly — the operator reads these values and passes
    # them as --config-reloader-{cpu,memory}-{request,limit} flags on its own container args
    # (templates/prometheus-operator/deployment.yaml), which it then applies to every
    # config-reloader sidecar it creates on Prometheus AND Alertmanager StatefulSets alike
    # (one operator, one shared reloader resource config — verified against the chart
    # template, not assumed). Environment-agnostic: same tiny reload-on-change sidecar
    # regardless of environment.
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 50m, memory: 64Mi }
