# Each dashboard folder becomes a grafana_dashboard: "1" ConfigMap. The
# grafana_folder annotation tells the kube-prometheus-stack Grafana sidecar where to write
# the files under /tmp/dashboards; Grafana then turns that directory structure into folders
# via provider.foldersFromFilesStructure.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Matches app-observability-dashboards.yaml's destination.namespace -- a manual
# `kubectl kustomize ... | kubectl apply -f -` (Step 4) lands the ConfigMap in the same place
# ArgoCD would put it, not the caller's current kubectl context namespace.
namespace: observability

configMapGenerator:
  - name: openlex-grafana-dashboards-applications
    files:
      - applications/golden-signals-api.json
      - applications/tier-and-quota.json
      - applications/trace-explorer.json
    options:
      annotations:
        grafana_folder: /tmp/dashboards/Applications
      labels:
        grafana_dashboard: "1"
  - name: openlex-grafana-dashboards-kubernetes
    files:
      - kubernetes/apiserver.json
      - kubernetes/cluster-total.json
      - kubernetes/controller-manager.json
      - kubernetes/etcd.json
      - kubernetes/k8s-coredns.json
      - kubernetes/k8s-resources-cluster.json
      - kubernetes/k8s-resources-multicluster.json
      - kubernetes/k8s-resources-namespace.json
      - kubernetes/k8s-resources-node.json
      - kubernetes/k8s-resources-nodes-overview.json
      - kubernetes/k8s-resources-pod.json
      - kubernetes/k8s-resources-workload.json
      - kubernetes/k8s-resources-workloads-namespace.json
      - kubernetes/kubelet.json
      - kubernetes/namespace-by-pod.json
      - kubernetes/namespace-by-workload.json
      - kubernetes/persistentvolumesusage.json
      - kubernetes/pod-total.json
      - kubernetes/proxy.json
      - kubernetes/scheduler.json
      - kubernetes/workload-total.json
    options:
      annotations:
        grafana_folder: /tmp/dashboards/Kubernetes
      labels:
        grafana_dashboard: "1"
  - name: openlex-grafana-dashboards-infrastructure
    files:
      - infrastructure/node-cluster-rsrc-use.json
      - infrastructure/node-rsrc-use.json
      - infrastructure/nodes.json
    options:
      annotations:
        grafana_folder: /tmp/dashboards/Infrastructure
      labels:
        grafana_dashboard: "1"
  - name: openlex-grafana-dashboards-observability
    files:
      - observability/alertmanager-overview.json
      - observability/grafana-overview.json
      - observability/otel-collector.json
      - observability/prometheus.json
    options:
      annotations:
        grafana_folder: /tmp/dashboards/Observability
      labels:
        grafana_dashboard: "1"
  - name: openlex-grafana-dashboards-product
    files:
      - product/product-and-usage.json
    options:
      annotations:
        grafana_folder: /tmp/dashboards/Product
      labels:
        grafana_dashboard: "1"
  - name: openlex-grafana-dashboards-executive
    files:
      - executive/executive-overview.json
    options:
      annotations:
        grafana_folder: /tmp/dashboards/Executive
      labels:
        grafana_dashboard: "1"
  - name: openlex-grafana-dashboards-oncall
    files:
      - oncall/incident.json
    options:
      annotations:
        grafana_folder: /tmp/dashboards/On-Call
      labels:
        grafana_dashboard: "1"
