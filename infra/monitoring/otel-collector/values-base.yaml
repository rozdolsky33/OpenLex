# infra/monitoring/otel-collector/values-base.yaml
#
# Shared base values for the OTel Collector, consumed by both kind and any future eks-demo
# Application. Traces export to Tempo + Jaeger. The `metrics` pipeline now also exports via the
# `prometheus` exporter so OTLP metrics pushed by the one-shot apps/worker (which can't be
# Prometheus-scraped like the long-running apps/api) reach Prometheus and the worker dashboard.
# `logs` stay `debug`-only (Loki wiring is a later phase).

mode: deployment

# The `prometheus` exporter (added for the worker metrics bridge below) ships only in the
# `-contrib` distribution, not core, so we pin the contrib image + its `otelcol-contrib`
# command name. contrib is a superset of core -- the otlp receiver / batch processor / debug &
# otlp exporters this config already used behave identically.
image:
  repository: otel/opentelemetry-collector-contrib

command:
  name: otelcol-contrib

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
          # apps/web's browser tracing (see apps/web/src/telemetry.ts) POSTs OTLP/HTTP spans
          # directly from the browser to this receiver -- a cross-origin request (the web UI
          # runs on localhost:5173, this receiver on localhost:4318, both via
          # scripts/kind/observability-port-forward.sh / scripts/kind/app-port-forward.sh), which
          # browsers block by default without an explicit CORS allowlist. Matches
          # openlex_shared.config's cors_allow_origins default for the same origin.
          cors:
            allowed_origins:
              - "http://localhost:5173"
  processors:
    batch: {}
  exporters:
    debug:
      verbosity: detailed
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true
    otlp/jaeger:
      endpoint: jaeger.observability.svc.cluster.local:4317
      tls:
        insecure: true
    # Re-exposes OTLP metrics (the worker's openlex_ingest_* instruments) as a Prometheus
    # scrape endpoint on :8889. resource_to_telemetry_conversion turns OTel Resource
    # attributes (service.name, k8s.pod.name, ...) into metric labels so the worker dashboard
    # can select by service. Scraped via the `prometheus` port + ServiceMonitor endpoint below.
    prometheus:
      endpoint: 0.0.0.0:8889
      resource_to_telemetry_conversion:
        enabled: true
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/tempo, otlp/jaeger]
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug, prometheus]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug]

ports:
  otlp:
    enabled: true
  otlp-http:
    enabled: true
  # The chart disables its own self-metrics port (8888) by default -- serviceMonitor.enabled
  # alone is not enough, the chart's own values.yaml says so explicitly ("you need to enable
  # the port in order to use the ServiceMonitor"). Without this, the ServiceMonitor below
  # selects a port name ("metrics") that doesn't exist on the Service, so Prometheus has zero
  # scrape targets for the collector -- confirmed live (no otelcol_* series anywhere, no
  # scrape target registered at all), which is also why no OTel Collector dashboard has ever
  # existed: there was nothing to build one from.
  metrics:
    enabled: true
  # The `prometheus` exporter's scrape endpoint (worker OTLP metrics re-exposed). Must match
  # the exporter's :8889 above and be listed in serviceMonitor.metricsEndpoints to be scraped.
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

serviceMonitor:
  enabled: true
  # Scrape BOTH the collector's own self-telemetry (port "metrics", 8888) AND the prometheus
  # exporter (port "prometheus", 8889) that carries the worker's openlex_ingest_* metrics.
  # Listing metricsEndpoints overrides the chart default of [{port: metrics}], so include both.
  metricsEndpoints:
    - port: metrics
    - port: prometheus
