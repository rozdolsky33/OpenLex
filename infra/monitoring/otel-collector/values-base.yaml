# infra/monitoring/otel-collector/values-base.yaml
#
# Shared base values for the OTel Collector, consumed by both kind and any future eks-demo
# Application. Phase 1 proved the receive-and-process path with a `debug`-only exporter for
# all three signals. Tempo and Jaeger are now deployed, so the `traces` pipeline exports to
# both real backends for comparison. `metrics`/`logs` stay `debug`-only — Loki/a real metrics
# backend for OTel-sourced data are later phases, not this one.

mode: deployment

# The chart no longer defaults image.repository (breaking change vs. the version this task
# was drafted against) — it now errors at render time unless set explicitly. This config only
# uses core components (otlp receiver, batch processor, debug exporter), all of which ship in
# the core `otel/opentelemetry-collector` image, so we pin that (with the matching
# `otelcol` command name) rather than pulling the larger `-contrib` image we don't need.
image:
  repository: otel/opentelemetry-collector

command:
  name: otelcol

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
          # apps/web's browser tracing (see apps/web/src/telemetry.ts) POSTs OTLP/HTTP spans
          # directly from the browser to this receiver -- a cross-origin request (the web UI
          # runs on localhost:5173, this receiver on localhost:4318, both via
          # scripts/kind/observability-port-forward.sh / scripts/kind/app-port-forward.sh), which
          # browsers block by default without an explicit CORS allowlist. Matches
          # openlex_shared.config's cors_allow_origins default for the same origin.
          cors:
            allowed_origins:
              - "http://localhost:5173"
  processors:
    batch: {}
  exporters:
    debug:
      verbosity: detailed
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true
    otlp/jaeger:
      endpoint: jaeger.observability.svc.cluster.local:4317
      tls:
        insecure: true
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/tempo, otlp/jaeger]
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug]

ports:
  otlp:
    enabled: true
  otlp-http:
    enabled: true
  # The chart disables its own self-metrics port (8888) by default -- serviceMonitor.enabled
  # alone is not enough, the chart's own values.yaml says so explicitly ("you need to enable
  # the port in order to use the ServiceMonitor"). Without this, the ServiceMonitor below
  # selects a port name ("metrics") that doesn't exist on the Service, so Prometheus has zero
  # scrape targets for the collector -- confirmed live (no otelcol_* series anywhere, no
  # scrape target registered at all), which is also why no OTel Collector dashboard has ever
  # existed: there was nothing to build one from.
  metrics:
    enabled: true

serviceMonitor:
  enabled: true
