# infra/argocd/apps/kind/app-jaeger.yaml
#
# Comparison trace backend (see infra/monitoring/jaeger/values-base.yaml's header for the
# in-memory-storage rationale). `jaeger.nodeSelector`/`jaeger.tolerations`/`jaeger.resources`
# are direct siblings under the top-level `jaeger:` key — verified via
# `helm show values jaegertracing/jaeger --version 4.11.*` (chart 4.11.1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jaeger
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: openlex-kind
  sources:
    - repoURL: https://jaegertracing.github.io/helm-charts
      chart: jaeger
      targetRevision: "4.11.*"
      helm:
        valueFiles:
          - $values/infra/monitoring/jaeger/values-base.yaml
        valuesObject:
          jaeger:
            nodeSelector:
              openlex.dev/workload: observability
            tolerations:
              - key: openlex.dev/workload
                operator: Equal
                value: observability
                effect: NoSchedule
            resources:
              requests: { cpu: 50m, memory: 128Mi }
              limits: { cpu: 200m, memory: 256Mi }
    - repoURL: https://github.com/rozdolsky33/OpenLex.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
