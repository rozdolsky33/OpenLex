# Creates the openlex-secrets Secret (RDS DSN + app config, from AWS Secrets Manager key
# openlex/app) EARLY and decoupled from the openlex app. Previously this ExternalSecret lived in
# the openlex kustomize overlay (deployed by the openlex Application, sync-wave 1), but wave-0
# consumers — notably postgres-exporter, which mounts openlex-secrets — then deadlocked: ArgoCD
# won't advance to wave 1 until wave 0 is healthy, so the Secret a wave-1 app would create never
# gets made. Creating it here at wave 0 (root-managed) breaks that cycle; both postgres-exporter
# (wave 0) and the openlex api/worker (wave 1) consume the Secret by name.
#
# Requires: external-secrets controller (app-external-secrets.yaml, wave -2) + the
# aws-secrets-manager ClusterSecretStore (secretstore-aws.yaml, wave 0), and the openlex/app
# secret present in AWS Secrets Manager. See docs/infrastructure/eks-argocd-bootstrap.md.
apiVersion: v1
kind: Namespace
metadata:
  name: openlex
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openlex-secrets-es
  namespace: openlex
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # external-secrets' CRDs are installed by app-external-secrets.yaml (wave -2); skip the
    # up-front dry-run so this doesn't fail validation before that CRD exists.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: openlex-secrets # must match base/{api,worker}'s envFrom.secretRef.name
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: openlex/app
