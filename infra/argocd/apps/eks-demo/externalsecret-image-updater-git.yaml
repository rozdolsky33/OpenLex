# Creates the `argocd-image-updater-git` Secret the image updater uses for HTTPS git write-back
# to the gitops/eks branch (referenced by app-openlex.yaml's write-back-method annotation:
# git:secret:argocd/argocd-image-updater-git). Keys `username` + `password` (a `repo`-scoped PAT)
# per the Argo CD Image Updater docs — same shape kind's scripts/kind/secrets-bootstrap.sh
# creates, but sourced from AWS Secrets Manager via ESO instead of .env.
#
# PREREQUISITE: an AWS Secrets Manager secret `openlex/image-updater-git` with JSON keys
# `username` (a GitHub user with push access) and `password` (the PAT). The external-secrets IRSA
# role already allows the openlex/* path (iam_irsa_external_secrets.tf). See
# docs/infrastructure/eks-argocd-bootstrap.md.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: image-updater-git-es
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # external-secrets' CRDs are installed by app-external-secrets.yaml (wave -2); skip the
    # up-front dry-run so this doesn't fail validation before that CRD exists.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: argocd-image-updater-git
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: openlex/image-updater-git
