# NLB annotations use the legacy in-tree AWS cloud provider (instance-mode target group) —
# deliberately not installing the AWS Load Balancer Controller as a separate component to keep
# the platform footprint minimal for a solo-dev demo. See
# docs/infrastructure/aws-eks-cost-estimate.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: openlex-eks-demo
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: "4.11.*"
    helm:
      valuesObject:
        controller:
          # The chart's admission-webhook creation runs as Helm-hook Jobs that self-delete; ArgoCD
          # then fails the sync ("Job/ingress-nginx-admission-create is missing"), so the controller
          # Deployment never gets created. Disable the admission webhook — acceptable for this demo
          # (it only validates Ingress specs at admission time) and the standard ArgoCD workaround.
          admissionWebhooks:
            enabled: false
          service:
            type: LoadBalancer
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
              service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
              service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
          resources:
            # 180Mi OOMKills the controller (exit 137) — it terminates TLS, handles every ingress
            # + the oauth2 auth subrequests, and reloads on each ingress change. OOM flapping drops
            # connections (curl: Empty reply / Failed to connect). Raised so it stays up.
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
