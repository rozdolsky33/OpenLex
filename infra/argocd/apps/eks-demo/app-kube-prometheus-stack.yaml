# infra/argocd/apps/eks-demo/app-kube-prometheus-stack.yaml
#
# Identical to infra/argocd/apps/kind/app-kube-prometheus-stack.yaml, including the shared
# values-base.yaml's additionalPrometheusRulesMap (the five symptom-based alerts) and
# Grafana's dashboard sidecar config -- both apply to eks-demo automatically once this
# Application syncs, no separate wiring needed. additionalDataSources' URLs are unchanged from
# kind's: Tempo/Jaeger/Loki resolve at the same in-cluster Service DNS names here as they do
# on kind (Tasks 6/7 gave eks-demo its own tempo/jaeger/loki Services in the same
# `observability` namespace).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: openlex-eks-demo
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "87.15.*"
      helm:
        valueFiles:
          - $values/infra/monitoring/kube-prometheus-stack/values-base.yaml
        valuesObject:
          prometheusOperator:
            # nodeSelector/tolerations only — resources already live in the shared
            # values-base.yaml (25m/64Mi request, 100m/128Mi limit); do not repeat them here.
            nodeSelector:
              openlex.dev/workload: observability
            tolerations:
              - key: openlex.dev/workload
                operator: Equal
                value: observability
                effect: NoSchedule
          prometheus:
            prometheusSpec:
              # retention/retentionSize/storageSpec now live in the shared values-base.yaml
              # (identical on kind and eks-demo) -- don't repeat them here.
              nodeSelector:
                openlex.dev/workload: observability
              tolerations:
                - key: openlex.dev/workload
                  operator: Equal
                  value: observability
                  effect: NoSchedule
              resources:
                requests: { cpu: 100m, memory: 400Mi }
                limits: { cpu: 500m, memory: 800Mi }
          alertmanager:
            alertmanagerSpec:
              nodeSelector:
                openlex.dev/workload: observability
              tolerations:
                - key: openlex.dev/workload
                  operator: Equal
                  value: observability
                  effect: NoSchedule
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 100m, memory: 64Mi }
          grafana:
            # No PVC — Grafana is stateless here: every dashboard and datasource is provisioned
            # from ConfigMaps (the observability-dashboards app), and users are auto-created by
            # GitHub SSO, so nothing in Grafana's SQLite DB needs to survive a restart. A gp3 PVC
            # was tried but gp3 is WaitForFirstConsumer, and ArgoCD health-gates the PVC to Bound
            # before it will roll the Deployment to mount it — a circular deadlock (PVC never binds
            # without a consumer; the consumer pod never rolls until the PVC binds). See
            # docs/postmortems/2026-07-16-eks-apps-node-capacity-and-grafana-pvc-deadlock.md.
            # emptyDir + Recreate is the right shape: Recreate keeps exactly one Grafana pod at a
            # time, so the SQLITE_BUSY-lock-on-restart 500 (the only reason a PVC was considered)
            # can't happen — there's never a second pod contending for the DB file.
            deploymentStrategy:
              type: Recreate
            # SSO auto-login: oauth2-proxy (app-oauth2-proxy.yaml) authenticates the user via GitHub
            # at the ingress edge and — running with --set-xauthrequest=true — forwards their identity
            # as X-Auth-Request-Email (the grafana Ingress copies it to this upstream via
            # auth-response-headers). auth.proxy makes Grafana TRUST that header and auto-login the
            # user, instead of falling back to its own admin login form after GitHub (the double-login
            # users hit otherwise). New users are auto-created (auto_sign_up) and assigned Admin
            # (users.auto_assign_org_role) — acceptable because oauth2-proxy already restricts who can
            # reach Grafana at all. whitelist pins header-setting to the in-cluster pod CIDR (only
            # ingress-nginx reaches Grafana), so the identity header can't be spoofed from outside.
            # The built-in admin login still works for direct (port-forward) break-glass access.
            grafana.ini:
              auth.proxy:
                enabled: true
                header_name: X-Auth-Request-Email
                header_property: email
                auto_sign_up: true
                whitelist: 10.42.0.0/16
                sync_ttl: 60
              auth:
                # Sign-out: with auth.proxy, Grafana's own "Sign out" is a no-op — the next request
                # still carries oauth2-proxy's X-Auth-Request-Email header and Grafana just
                # re-logs-you-in. Redirect Grafana's sign-out to oauth2-proxy's /oauth2/sign_out so it
                # actually clears the proxy session. (True end-to-end sign-out would also require
                # logging out of GitHub itself, which GitHub OAuth can't force — but this ends the
                # Grafana/proxy session, which is the meaningful logout here.)
                signout_redirect_url: https://grafana.openlex.arwest.dev/oauth2/sign_out?rd=https%3A%2F%2Fgrafana.openlex.arwest.dev
              users:
                auto_assign_org_role: Admin
            nodeSelector:
              openlex.dev/workload: observability
            tolerations:
              - key: openlex.dev/workload
                operator: Equal
                value: observability
                effect: NoSchedule
            resources:
              requests: { cpu: 50m, memory: 256Mi }
              limits: { cpu: 300m, memory: 768Mi }
            additionalDataSources:
              - name: Tempo
                uid: tempo
                type: tempo
                access: proxy
                url: http://tempo.observability.svc.cluster.local:3200
                isDefault: false
                jsonData:
                  # Without this, the Tempo datasource's Service Graph feature (used by
                  # applications/trace-explorer.json's "Service graph" panel) has no way to
                  # know which Prometheus datasource holds the traces_service_graph_* metrics
                  # Tempo's metrics-generator writes -- it silently renders empty even though
                  # the metrics genuinely exist (confirmed live: 46 traces_service_graph_*
                  # series in Prometheus), because the panel has nowhere to query. `prometheus`
                  # is this same Application's own Prometheus datasource uid (set explicitly
                  # above kube-prometheus-stack's chart convention, matching what
                  # applications/tier-and-quota.json already hardcodes).
                  serviceMap:
                    datasourceUid: prometheus
              - name: Jaeger
                uid: jaeger
                type: jaeger
                access: proxy
                url: http://jaeger.observability.svc.cluster.local:16686
                isDefault: false
              - name: Loki
                uid: loki
                type: loki
                access: proxy
                url: http://loki.observability.svc.cluster.local:3100
                isDefault: false
          kube-state-metrics:
            nodeSelector:
              openlex.dev/workload: observability
            tolerations:
              - key: openlex.dev/workload
                operator: Equal
                value: observability
                effect: NoSchedule
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { cpu: 50m, memory: 64Mi }
          prometheus-node-exporter:
            # Stamp cluster="openlex-eks-demo" onto every node-exporter series at scrape time. The
            # Infrastructure dashboards (node-exporter mixin: nodes / node-rsrc-use /
            # node-cluster-rsrc-use) have a `cluster` template variable from
            # label_values(node_uname_info, cluster) and chain `instance` off it, then filter panels
            # by instance="$instance". With no cluster label the variable is empty, the chain doesn't
            # resolve, $instance ends up empty, and instance="" matches nothing → "No data" (the
            # metrics themselves are present). This must be a scrape-time relabeling (targetLabel on
            # the ServiceMonitor), NOT prometheusSpec.externalLabels — external labels are only
            # attached on remote-write/federation/alerting, never in the local queries the dashboards
            # run, so they don't populate the variable. The mixin's recording rules
            # (instance:node_cpu_utilisation:rate5m, …) aggregate with `without(...)`, so they inherit
            # this cluster label automatically.
            prometheus:
              monitor:
                relabelings:
                  - targetLabel: cluster
                    replacement: openlex-eks-demo
            # DaemonSet — must run on every node (including control-plane and the dedicated
            # observability node, to report their own metrics), so no nodeSelector restricting
            # it. The chart's own default tolerations (verified: charts/prometheus-node-
            # exporter/values.yaml) is a single blanket `{effect: NoSchedule, operator: Exists}`
            # entry that already tolerates ANY NoSchedule taint, including control-plane's and
            # our custom observability one. An earlier pass replaced this with only the
            # observability-specific entry — Helm array-replace (not merge) semantics meant
            # that silently dropped control-plane scheduling (confirmed live: node-exporter was
            # missing from openlex-control-plane, exactly the same bug class Promtail hit and
            # fixed in Task 9). Restoring the chart's own blanket form here, which covers both
            # taints at once rather than listing them individually.
            tolerations:
              - effect: NoSchedule
                operator: Exists
            resources:
              requests: { cpu: 10m, memory: 24Mi }
              limits: { cpu: 50m, memory: 48Mi }
    - repoURL: https://github.com/rozdolsky33/OpenLex.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
