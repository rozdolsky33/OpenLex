# serviceAccount.name pinned to match the IRSA trust policy in
# infra/terraform/iam_irsa_external_dns.tf — replace <EXTERNAL_DNS_ROLE_ARN> with
# `terraform output external_dns_role_arn`, and <DOMAIN> with the real demo domain.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: openlex-eks-demo
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns
    chart: external-dns
    targetRevision: "1.15.*"
    helm:
      valuesObject:
        provider: aws
        aws:
          region: us-east-1
        domainFilters:
          - "<DOMAIN>"
        txtOwnerId: openlex-eks-demo
        serviceAccount:
          name: external-dns
          annotations:
            eks.amazonaws.com/role-arn: "<EXTERNAL_DNS_ROLE_ARN>"
        resources:
          requests: { cpu: 25m, memory: 32Mi }
          limits: { cpu: 100m, memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
