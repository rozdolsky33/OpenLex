# Auth is via the external-secrets pod's own IRSA-bound ServiceAccount (see
# app-external-secrets.yaml) — no static AWS credentials anywhere.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # external-secrets' CRDs are installed by app-external-secrets.yaml (sync-wave -2). Skip the
    # up-front dry-run so this ClusterSecretStore doesn't fail validation before that CRD exists.
    # ServerSideApply hands GVK resolution to the API server, so the apply works even when the
    # app-controller's client-side RESTMapper hasn't yet picked up a CRD installed earlier in the
    # same sync (the "no matches for kind … ensure CRDs are installed first" failure). Paired with
    # SkipDryRunOnMissingResource for the pre-flight. See docs/infrastructure/eks-argocd-bootstrap.md.
    argocd.argoproj.io/sync-options: ServerSideApply=true,SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
