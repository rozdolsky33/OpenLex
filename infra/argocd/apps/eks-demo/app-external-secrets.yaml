# serviceAccount.name is pinned explicitly (not left to the chart default) so it matches the
# IRSA trust policy's `StringEquals` condition set in infra/terraform/iam_irsa_external_secrets.tf
# — replace <EXTERNAL_SECRETS_ROLE_ARN> with `terraform output external_secrets_role_arn`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: openlex-eks-demo
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "0.10.*"
    helm:
      valuesObject:
        installCRDs: true
        serviceAccount:
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: "arn:aws:iam::651261648885:role/openlex-eks-demo-external-secrets"
        resources:
          requests: { cpu: 25m, memory: 64Mi }
          limits: { cpu: 100m, memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
