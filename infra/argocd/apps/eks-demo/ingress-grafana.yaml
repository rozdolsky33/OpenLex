# infra/argocd/apps/eks-demo/ingress-grafana.yaml
#
# TWO Ingresses for grafana.openlex.arwest.dev, the canonical ingress-nginx + oauth2-proxy split:
#
#   1. `grafana-oauth2` (this first doc) routes /oauth2/* straight to oauth2-proxy with NO auth
#      annotations. This MUST be a separate Ingress: ingress-nginx applies auth-url/auth-signin to
#      *every* path in an Ingress, so if /oauth2 shared an Ingress with the gated / path, the login
#      endpoints (/oauth2/start, /oauth2/callback) would themselves get auth-gated -> the browser
#      redirects /oauth2/start -> /oauth2/start -> ... forever (an infinite loop, seen as "no
#      Grafana access"). Keeping /oauth2 ungated lets oauth2-proxy actually redirect to GitHub.
#   2. `grafana` (second doc) carries the auth-url/auth-signin annotations and routes / to Grafana.
#
# Both share the host + grafana-tls cert (cert-manager annotation lives on the `grafana` doc; the
# oauth2 doc just reuses the same secret). Targets kube-prometheus-stack-grafana (the bundled
# Grafana). Lives here, not infra/kubernetes/overlays/eks-demo/, for the same namespace-transformer
# reason as externalsecret-oauth2-proxy.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-oauth2
  namespace: observability
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Deliberately NO auth-url/auth-signin here — these are the oauth2-proxy login endpoints and
    # must stay ungated, otherwise the sign-in flow loops back on itself.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grafana.openlex.arwest.dev
      secretName: grafana-tls
  rules:
    - host: grafana.openlex.arwest.dev
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  # the oauth2-proxy Service exposes port 80 (-> pod's 4180); 4180 is the pod
                  # port, not a Service port, so routing to :4180 yields 503 -> grafana 500.
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # auth-url is the INTERNAL oauth2-proxy Service (server-side auth check): pointing it at the
    # external https URL makes ingress-nginx round-trip back through the NLB to itself for every
    # request — slow (seen at ~38s) and destabilizing. auth-signin stays external (browser redirect).
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.observability.svc.cluster.local:80/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://grafana.openlex.arwest.dev/oauth2/start?rd=$scheme://$host$request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User, X-Auth-Request-Email"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grafana.openlex.arwest.dev
      secretName: grafana-tls
  rules:
    - host: grafana.openlex.arwest.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
