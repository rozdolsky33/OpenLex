# Overrides ArgoCD's auto-generated admin password with one chosen ahead of time — required
# since this ArgoCD is public-facing for the demo. The AWS Secrets Manager secret
# `openlex/argocd-admin` must hold a JSON object with:
#   "password"      -> bcrypt hash of the chosen password, e.g. computed locally via
#                      `htpasswd -nbBC 10 "" '<password>' | tr -d ':\n' | sed 's/^\$2y/\$2a/'`
#                      (never store the plaintext password anywhere, including here)
#   "passwordMtime" -> an RFC3339 timestamp (e.g. `date -u +%Y-%m-%dT%H:%M:%SZ`); ArgoCD
#                      ignores a password update unless this also changes
# creationPolicy: Merge because `argocd-secret` already exists (created by the argo-cd Helm
# chart) with other keys (server.secretkey, etc.) that must not be clobbered.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-admin-password
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: admin.password
      remoteRef:
        key: openlex/argocd-admin
        property: password
    - secretKey: admin.passwordMtime
      remoteRef:
        key: openlex/argocd-admin
        property: passwordMtime
