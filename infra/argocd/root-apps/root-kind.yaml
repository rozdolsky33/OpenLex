# The one Application a human applies by hand for kind (via scripts/argocd-bootstrap.sh kind):
# `kubectl apply -f infra/argocd/projects/appproject-kind.yaml -f infra/argocd/root-apps/root-kind.yaml`
# Everything else in infra/argocd/apps/kind/ is then reconciled automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-kind
  namespace: argocd
spec:
  project: openlex-kind
  source:
    repoURL: https://github.com/rozdolsky33/OpenLex.git
    targetRevision: main
    path: infra/argocd/apps/kind
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
