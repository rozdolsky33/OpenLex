# Helm values for `helm upgrade --install argocd argo/argo-cd -n argocd -f this-file`
# (see scripts/kind/argocd-bootstrap.sh). Sized conservatively — this shares one t4g.medium node
# with ingress-nginx, cert-manager, external-dns, external-secrets, and the openlex workload
# (see docs/infrastructure/aws-eks-cost-estimate.md). TLS terminates at ingress-nginx +
# cert-manager (infra/argocd/apps/eks-demo/argocd-ingress.yaml), so ArgoCD's own server runs
# in insecure (plain HTTP) mode to avoid double TLS termination — intentional, not an oversight.
configs:
  cm:
    kustomize.buildOptions: "--load-restrictor LoadRestrictionsNone"

server:
  extraArgs:
    - --insecure
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 200m, memory: 192Mi }

repoServer:
  resources:
    # 256Mi OOMKills the repo-server during the initial bootstrap: it renders ~14 Helm charts
    # (kube-prometheus-stack, loki, tempo, cert-manager, …) concurrently, and the big charts
    # spike memory. Raised so the first sync doesn't crash-loop (connection refused ->
    # ComparisonError on every app). Steady-state usage is much lower.
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 768Mi }

applicationSet:
  enabled: false

notifications:
  enabled: false

redis:
  resources:
    requests: { cpu: 25m, memory: 48Mi }
    limits: { cpu: 100m, memory: 96Mi }

controller:
  resources:
    # Like the repo-server above, 256Mi OOMKills the application-controller during bootstrap —
    # it reconciles all ~14 child apps at once (kube-prometheus-stack alone has a large resource
    # tree). Raised so it doesn't crash-loop while the stack converges.
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 768Mi }
