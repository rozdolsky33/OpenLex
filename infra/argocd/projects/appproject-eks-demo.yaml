apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: openlex-eks-demo
  namespace: argocd
spec:
  description: OpenLex workload + platform add-ons on the EKS demo cluster
  sourceRepos:
    - https://github.com/rozdolsky33/OpenLex.git
    # Helm chart sources for platform components (ingress-nginx, cert-manager, external-dns,
    # external-secrets) — each Application below points at the upstream chart repo directly.
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jetstack.io
    - https://kubernetes-sigs.github.io/external-dns
    - https://charts.external-secrets.io
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://grafana.github.io/helm-charts
    - https://jaegertracing.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://oauth2-proxy.github.io/manifests
    - https://argoproj.github.io/argo-helm # argocd-image-updater chart (ADR-0007)
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
