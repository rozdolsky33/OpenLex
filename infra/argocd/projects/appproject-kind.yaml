apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: openlex-kind
  namespace: argocd
spec:
  description: OpenLex workload on the local kind cluster
  sourceRepos:
    - https://github.com/rozdolsky33/OpenLex.git
    # Helm chart sources for the observability stack (see
    # docs/superpowers/specs/2026-07-12-production-observability-design.md) — each
    # Application below points at the upstream chart repo directly.
    - https://prometheus-community.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://grafana.github.io/helm-charts
    - https://jaegertracing.github.io/helm-charts
    - https://argoproj.github.io/argo-helm  # argocd-image-updater chart (ADR-0007)
  destinations:
    - namespace: openlex
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: observability
      server: https://kubernetes.default.svc
    # kube-prometheus-stack creates a handful of Services in kube-system (coredns,
    # kube-controller-manager, kube-etcd, kube-proxy, kube-scheduler) so Prometheus can
    # discover and scrape these core Kubernetes components. Direct `helm upgrade` (used for
    # local pre-merge verification throughout this project) doesn't enforce AppProject
    # destination rules, so this went unnoticed until the first real ArgoCD-driven sync of
    # this Application post-merge failed with "namespace kube-system is not permitted".
    # These are read-only Service objects pointing at existing control-plane endpoints, not
    # Pods/Deployments/Secrets — explicitly confirmed with the user before adding this.
    - namespace: kube-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
