apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlex-api
spec:
  template:
    spec:
      containers:
        - name: api
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 100m
              memory: 192Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlex-worker
spec:
  template:
    spec:
      containers:
        - name: worker
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 100m
              memory: 192Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
