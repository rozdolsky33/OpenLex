apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlex-api
spec:
  # 2 replicas spread across the two `openlex.dev/workload=apps` nodes (see
  # infra/kubernetes/kind/kind-config.yaml) via the preferred podAntiAffinity below — real
  # separation from the dedicated observability node, and real (if kind-scale) HA instead of
  # both replicas landing on whatever node is free. See
  # infra/kubernetes/overlays/kind/pdb-openlex-api.yaml for what backs this during voluntary
  # disruptions.
  #
  # CAVEAT (confirmed via a live kubectl drain test): this is `preferred`
  # (soft) anti-affinity, not `required` — required would leave the evicted replica stuck
  # Pending during a drain on a 2-apps-node cluster (no third node to land on), which defeats
  # the point of draining at all. The tradeoff: after a drain-and-reschedule, both replicas can
  # end up co-located on the same apps node (confirmed live — this actually happened), and
  # nothing re-spreads them automatically afterward. The PDB-backed *disruption survivability*
  # is real and proven; the *steady-state spread* is best-effort only, not self-healing. A
  # Kubernetes descheduler (or a 3rd apps node) would be needed to restore the spread
  # automatically — out of scope for this kind-scale setup.
  replicas: 2
  template:
    spec:
      nodeSelector:
        openlex.dev/workload: apps
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: openlex-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # The Dockerfile's `uv run` re-syncs the venv on every container start (visible as
          # "Ignoring existing virtual environment linked to non-existent Python interpreter"
          # in pod logs) and the embedding model (torch + sentence-transformers, downloaded
          # fresh from HuggingFace every cold start — no baked-in weights, no persistent HF
          # cache volume) is preloaded at startup. Under the original 100m CPU / 192Mi memory
          # limits this never finished within any reasonable liveness window — confirmed via
          # `kubectl logs` always stopping at "Waiting for application startup" and exit code
          # 137 from the liveness kill, not an actual crash. kind-only override (not the
          # shared base, which eks-demo also uses) discovered while bootstrapping
          # observability Phase 1 — the underlying re-sync-on-start behavior and lack of a
          # model cache volume are separate, out-of-scope fixes.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlex-worker
spec:
  template:
    spec:
      nodeSelector:
        openlex.dev/workload: apps
      containers:
        - name: worker
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # Same root cause as openlex-api's resource bump (see above): ingestion loads the
          # same torch + sentence-transformers embedding model, and the original 100m/192Mi
          # limits OOMKilled the worker the first time ingestion actually ran against kind
          # (exitCode 137, reason OOMKilled) — this had never been exercised during Phase 1
          # since ingestion wasn't run there. kind-only override, same as api's.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  # Single instance — real Postgres HA (streaming replicas, failover) would need an operator
  # (e.g. CloudNativePG/Patroni), out of scope here. This only keeps Postgres off the
  # dedicated observability node, same as the other app workloads.
  template:
    spec:
      nodeSelector:
        openlex.dev/workload: apps
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
