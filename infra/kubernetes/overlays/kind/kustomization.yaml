apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openlex
# No ingress/TLS for kind — access via `kubectl port-forward` (scripts/kind/app-port-forward.sh).
resources:
- ../../base/postgres
- ../../base/api
- ../../base/worker
- ../../base/web
- servicemonitor-openlex-api.yaml
- pdb-openlex-api.yaml
# Images are built + `kind load docker-image`-ed locally (kind can't pull from nowhere) —
# see scripts/kind/load-images.sh. Tags here must match what was loaded.
images:
- name: openlex-api
  newName: ghcr.io/rozdolsky33/openlex-api
  newTag: 6df2b65eb64c4542421a8a299add2c937bbad33d
- name: openlex-web
  newName: ghcr.io/rozdolsky33/openlex-web
  newTag: 6df2b65eb64c4542421a8a299add2c937bbad33d
- name: openlex-worker
  newName: ghcr.io/rozdolsky33/openlex-worker
  newTag: 6df2b65eb64c4542421a8a299add2c937bbad33d
- name: ghcr.io/rozdolsky33/openlex-api
  newTag: b7785bf717a1b79de25cfcf7a3c2cbfc3df035f0
- name: ghcr.io/rozdolsky33/openlex-worker
  newTag: b7785bf717a1b79de25cfcf7a3c2cbfc3df035f0
- name: ghcr.io/rozdolsky33/openlex-web
  newTag: 0ebfa173fbe371d158334c6a71a57dea728ad061
patches:
- path: patch-resources.yaml
