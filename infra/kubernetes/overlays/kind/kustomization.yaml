apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openlex

# No ingress/TLS for kind — access via `kubectl port-forward`. web is intentionally excluded
# (apps/web has no Dockerfile yet, see infra/kubernetes/README.md).
resources:
  - ../../base/postgres
  - ../../base/api
  - ../../base/worker
  - servicemonitor-openlex-api.yaml

# Images are built + `kind load docker-image`-ed locally (kind can't pull from nowhere) —
# see scripts/kind-up.sh. Tags here must match what was loaded.
images:
  - name: openlex-api
    newName: openlex-api
    newTag: kind-local
  - name: openlex-worker
    newName: openlex-worker
    newTag: kind-local

patches:
  - path: patch-resources.yaml
