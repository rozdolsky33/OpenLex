apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openlex

# web is intentionally excluded (apps/web has no Dockerfile yet, see infra/kubernetes/README.md).
# postgres is intentionally excluded -- eks-demo uses RDS (infra/terraform/rds.tf), not an
# in-cluster StatefulSet. That stays kind-only (infra/kubernetes/overlays/kind/).
resources:
  - ../../base/api
  - ../../base/worker
  # openlex-secrets is created earlier (root-managed, wave 0) by
  # infra/argocd/apps/eks-demo/externalsecret-openlex-secrets.yaml so wave-0 consumers
  # (postgres-exporter) don't deadlock on a wave-1 Secret — api/worker just consume it by name.
  - ingress-api.yaml
  - pdb-openlex-api.yaml
  # Prometheus scrape config for openlex-api's /metrics — without it the openlex_* app metrics
  # never reach Prometheus and every app dashboard shows "No data". See the file's header.
  - servicemonitor-openlex-api.yaml

# Replace <ECR_ACCOUNT>.dkr.ecr.<REGION>.amazonaws.com with `terraform output ecr_repository_urls`
# (infra/terraform) after the first apply, and bump the tag on every image push. See
# infra/kubernetes/README.md and docs/infrastructure/mlops-guide.md's CI-follow-up note —
# this is manual for the first cut, automated later (Argo Image Updater or a CI tag-bump step).
images:
  - name: openlex-api
    newName: 651261648885.dkr.ecr.us-east-1.amazonaws.com/openlex-api
    newTag: v0.1.0
  - name: openlex-worker
    newName: 651261648885.dkr.ecr.us-east-1.amazonaws.com/openlex-worker
    newTag: v0.1.0

patches:
  - path: patch-resources.yaml
