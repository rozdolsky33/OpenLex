# Requires the `external-secrets` Application + the `aws-secrets-manager` ClusterSecretStore
# (infra/argocd/apps/eks-demo/) to be Synced first, and the openlex/app secret to already exist
# in AWS Secrets Manager (see infra/terraform/README.md's setup sequence).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openlex-secrets-es
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: openlex-secrets # must match base/{api,worker}'s envFrom.secretRef.name
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: openlex/app
