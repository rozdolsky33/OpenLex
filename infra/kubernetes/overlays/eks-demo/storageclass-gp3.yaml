# infra/kubernetes/overlays/eks-demo/storageclass-gp3.yaml
#
# The aws-ebs-csi-driver EKS addon (infra/terraform/eks.tf, Task 4) installs the CSI driver
# itself but does not create a gp3 StorageClass automatically -- EKS's built-in default is
# still the older in-tree "gp2" StorageClass. Marked as the cluster's default StorageClass so
# Tempo's and Loki's PVCs (Tasks 6/7) bind automatically without needing an explicit
# storageClassName override in either chart's values -- the same "just works" experience kind
# gets from its own default `standard` StorageClass. Cluster-scoped -- kustomize's
# `namespace: openlex` transformer (this overlay's global setting) only affects namespaced
# resources, so it's safe to include here.
#
# COLLISION: EKS ships the built-in in-tree "gp2" StorageClass already marked as the cluster
# default (storageclass.kubernetes.io/is-default-class: "true"), and nothing in this repo
# unmarks it. With both "gp2" and "gp3" marked default, a PVC without an explicit
# storageClassName (e.g. Phase 7b's Tempo/Loki PVCs) binds non-deterministically. This can't be
# fixed via Kustomize/GitOps here -- redefining "gp2"'s exact spec risks drifting from whatever
# EKS actually ships for a given cluster version -- so it's a documented one-time imperative
# step instead (same category as this repo's other manual steps: see
# infra/terraform/README.md's "First-time setup" list). Run once per cluster, after
# `aws eks update-kubeconfig`:
#   kubectl patch storageclass gp2 -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}'
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
