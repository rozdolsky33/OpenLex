# apps/web's Dockerfile runs `npm run dev` (Vite dev server, hot reload) bound to 0.0.0.0:5173
# -- it's a dev-server image, not a production nginx build, so containerPort is 5173, not 80.
# Referenced only by overlays/kind (local dev access) -- eks-demo still has no image build/push
# pipeline for apps/web, out of scope here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlex-web
  labels:
    app.kubernetes.io/name: openlex-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openlex-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openlex-web
    spec:
      containers:
        - name: web
          image: openlex-web:placeholder
          ports:
            - containerPort: 5173
              name: http
          env:
            # Baked into the browser bundle by Vite (import.meta.env.VITE_API_BASE_URL, see
            # apps/web/src/api/client.ts) -- evaluated client-side, so this must be reachable
            # from the developer's own browser, not from inside the pod. Matches
            # scripts/app-port-forward.sh's `kubectl port-forward svc/openlex-api 8000:80`, and
            # openlex_shared.config's cors_allow_origins default
            # (http://localhost:5173) already allows this pairing.
            - name: VITE_API_BASE_URL
              value: http://localhost:8000
            # Same "baked into the browser bundle, must be reachable from the developer's own
            # browser" reasoning as VITE_API_BASE_URL above -- matches
            # scripts/observability-port-forward.sh's forwarded Collector OTLP/HTTP port. See
            # apps/web/src/telemetry.ts; unset would just mean tracing is skipped, not broken.
            - name: VITE_OTLP_ENDPOINT
              value: http://localhost:4318
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
