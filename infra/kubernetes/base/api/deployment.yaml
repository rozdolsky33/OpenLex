apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlex-api
  labels:
    app.kubernetes.io/name: openlex-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openlex-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openlex-api
    spec:
      serviceAccountName: openlex-api
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: openlex-api:placeholder # set by the images: transformer in each overlay
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: openlex-secrets
          env:
            # Downward API -- fed into OTEL_RESOURCE_ATTRIBUTES below so every span this
            # process emits carries k8s.pod.name/k8s.node.name as OTel Resource attributes
            # (shown as Jaeger "Process" tags, once per trace -- not repeated per-span
            # attributes, since pod/node identity is fixed for this container's lifetime).
            # openlex_api.telemetry's Resource.create() already merges OTEL_RESOURCE_ATTRIBUTES
            # automatically (standard OTel SDK behavior) -- no application code change needed.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME)"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
