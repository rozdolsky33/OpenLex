apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlex-api
  labels:
    app.kubernetes.io/name: openlex-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openlex-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openlex-api
    spec:
      serviceAccountName: openlex-api
      containers:
        - name: api
          image: openlex-api:placeholder # set by the images: transformer in each overlay
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: openlex-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
