apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlex-worker
  labels:
    app.kubernetes.io/name: openlex-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openlex-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openlex-worker
    spec:
      serviceAccountName: openlex-worker
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: worker
          image: openlex-worker:placeholder # set by the images: transformer in each overlay
          envFrom:
            - secretRef:
                name: openlex-secrets
          env:
            # Downward API -> OTEL_RESOURCE_ATTRIBUTES so every span carries
            # k8s.pod.name/k8s.node.name as OTel Resource attributes (Jaeger "Process" tags),
            # matching apps/api's deployment. openlex_worker.telemetry's Resource.create()
            # merges OTEL_RESOURCE_ATTRIBUTES automatically (standard OTel SDK behavior).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME)"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
