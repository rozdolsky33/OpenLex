apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          # shared_preload_libraries can only be set at server start (not reloadable), so it's
          # passed as an arg override rather than a runtime config change -- required for
          # pg_stat_statements (slow-query / call-rate visibility via postgres_exporter, see
          # docs/superpowers/specs/2026-07-12-production-observability-design.md). The
          # extension itself (`CREATE EXTENSION pg_stat_statements`) still needs to be created
          # once per database -- the postgres image's /docker-entrypoint-initdb.d scripts only
          # run against a fresh (empty) PGDATA, not an already-initialized volume, so on an
          # existing cluster this is a one-time manual `kubectl exec ... psql` step after this
          # restart, same caveat migrations/postgres/*.sql already carries.
          #
          # Deliberately `args:`, NOT `command:` -- confirmed live the hard way: `command:`
          # overrides the image's ENTRYPOINT (`docker-entrypoint.sh`), which is what drops
          # privileges from root to the `postgres` user before exec'ing the server. Setting
          # `command: [postgres, -c, ...]` bypassed that entrypoint entirely, ran `postgres`
          # directly as root, and crash-looped with "root execution of the PostgreSQL server is
          # not permitted". `args:` overrides only the image's CMD, which the entrypoint script
          # still receives as "$@" and passes through after its own setup/privilege-drop.
          args:
            - postgres
            - -c
            - shared_preload_libraries=pg_stat_statements
          ports:
            - containerPort: 5432
              name: postgres
          env:
            # Matches docker-compose.yml's current (non-hardened) fixed dev credentials —
            # hardening this (e.g. sourcing from a secret) is a future follow-up, not this plan.
            - name: POSTGRES_USER
              value: openlex
            - name: POSTGRES_PASSWORD
              value: openlex
            - name: POSTGRES_DB
              value: openlex
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "openlex"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "openlex"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init-sql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
