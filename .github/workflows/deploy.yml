# .github/workflows/deploy.yml
name: deploy

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      # Serialize builds per develop push (no cancel) so concurrent runs don't race the GHCR
      # registry. The job no longer commits to git (Argo CD Image Updater owns image updates),
      # so the old non-fast-forward-push concern is gone -- this is just build hygiene now.
      group: deploy-develop
      cancel-in-progress: false
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-platform build support -- GitHub-hosted runners are linux/amd64, but this
      # project's kind cluster runs on Apple Silicon (linux/arm64). Without this, every image
      # below would only ever be built for the runner's own architecture, and the arm64 kind
      # cluster would have to fall back to QEMU *runtime* emulation to run an amd64 image --
      # discovered live via a real crash: apps/web's container segfaulted under that emulation
      # (`qemu: uncaught target signal 11`), a well-known failure mode for Vite/esbuild's
      # native bindings (apps/api and apps/worker are pure Python and tolerated the same
      # emulation fine, just not apps/web). setup-qemu-action here is for buildx's
      # *cross-compilation* at build time (a different, working use of QEMU than the broken
      # runtime-emulation path above) -- the result is a real multi-arch manifest list, so
      # kind (arm64) and any future amd64 target (e.g. EKS, Phase 7) each pull their own
      # native build with no emulation involved at any point.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push openlex-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/openlex-api:${{ github.sha }}

      - name: Build and push openlex-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/openlex-worker:${{ github.sha }}

      - name: Build and push openlex-web
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/openlex-web:${{ github.sha }}

      # No image-tag commit here on purpose. Argo CD Image Updater
      # (infra/argocd/apps/kind/app-argocd-image-updater.yaml) watches GHCR, picks the
      # newest-built image, and git-writes the kustomize tags to the `gitops/kind` branch that
      # the openlex Application tracks. This keeps develop code-only -- no GITHUB_TOKEN bot
      # commit on develop's mainline, which previously caused non-fast-forward races and blocked
      # develop->main promotions (bot commits can't get the required CI checks).
