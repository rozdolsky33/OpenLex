# .github/workflows/deploy.yml
name: deploy

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-develop
      cancel-in-progress: false # queue, don't cancel/collide -- primary defense against a
        # human merge to develop landing mid-run and making the final `git push origin
        # HEAD:develop` a non-fast-forward rejection.
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-platform build support -- GitHub-hosted runners are linux/amd64, but this
      # project's kind cluster runs on Apple Silicon (linux/arm64). Without this, every image
      # below would only ever be built for the runner's own architecture, and the arm64 kind
      # cluster would have to fall back to QEMU *runtime* emulation to run an amd64 image --
      # discovered live via a real crash: apps/web's container segfaulted under that emulation
      # (`qemu: uncaught target signal 11`), a well-known failure mode for Vite/esbuild's
      # native bindings (apps/api and apps/worker are pure Python and tolerated the same
      # emulation fine, just not apps/web). setup-qemu-action here is for buildx's
      # *cross-compilation* at build time (a different, working use of QEMU than the broken
      # runtime-emulation path above) -- the result is a real multi-arch manifest list, so
      # kind (arm64) and any future amd64 target (e.g. EKS, Phase 7) each pull their own
      # native build with no emulation involved at any point.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push openlex-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/openlex-api:${{ github.sha }}

      - name: Build and push openlex-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/openlex-worker:${{ github.sha }}

      - name: Build and push openlex-web
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/openlex-web:${{ github.sha }}

      - name: Bump image tags in the kind overlay and push to develop
        # Rebase-safe against a concurrent develop update: re-sync onto the latest develop and
        # re-apply the kustomize image bump on each attempt. The `concurrency` block serializes
        # deploy runs but can't stop a human PR merge from advancing develop between this job's
        # checkout and its push -- which used to make `git push HEAD:develop` a non-fast-forward
        # rejection (seen live during rapid successive merges). Retrying onto latest develop
        # fixes that; the last deploy run still wins with the newest image tags.
        #
        # Pushes with this job's own GITHUB_TOKEN (checkout@v4's persist-credentials) do NOT
        # re-trigger workflow runs -- this is what stops this bot commit from re-triggering
        # deploy.yml in an infinite loop. Do not swap for a PAT without addressing that loop.
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz
          KUSTOMIZE="$(pwd)/kustomize"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin develop
            git reset --hard --quiet origin/develop
            ( cd infra/kubernetes/overlays/kind
              "${KUSTOMIZE}" edit set image \
                "openlex-api=${REGISTRY}/${IMAGE_OWNER}/openlex-api:${GITHUB_SHA}" \
                "openlex-worker=${REGISTRY}/${IMAGE_OWNER}/openlex-worker:${GITHUB_SHA}" \
                "openlex-web=${REGISTRY}/${IMAGE_OWNER}/openlex-web:${GITHUB_SHA}" )
            git add infra/kubernetes/overlays/kind/kustomization.yaml
            if git diff --cached --quiet; then
              echo "No image-tag changes to commit (rebuilt identical digests)."
              exit 0
            fi
            git commit -m "chore: deploy ${GITHUB_SHA}"
            if git push origin HEAD:develop; then
              echo "Pushed tag bump on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt} (develop advanced) -- re-syncing and retrying."
            sleep "$((attempt * 3))"
          done
          echo "Failed to push the deploy tag bump after 5 attempts." >&2
          exit 1
