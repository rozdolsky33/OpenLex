name: api

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/**"
      - "schemas/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway CI config
        # openlex_shared.config.Settings requires these at import time (no .env exists in CI).
        # Only apps/api/tests + packages/*/tests run here -- all mock external calls, so these
        # are never used for a real Claude call, DB connection, or token check. Generated at
        # runtime rather than hardcoded so secret scanners (gitleaks/GitGuardian) never see a
        # secret-shaped literal in this file.
        run: |
          {
            echo "ANTHROPIC_API_KEY=ci-not-used"
            echo "DATABASE_URL=postgresql+asyncpg://ci-not-used/ci"
            echo "JWT_SECRET_KEY=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      # --all-packages, not --package openlex-api: a package-scoped sync only installs that
      # package's own dependency closure, which excludes both the dev group (ruff/mypy/pytest)
      # and workspace members it doesn't itself depend on (e.g. legal_parsing) -- but this job
      # lints/tests all of `packages/`, not just openlex-api's own dependencies.
      - run: uv sync --all-packages
      - run: uv run ruff check apps/api packages
      - run: uv run ruff format --check apps/api packages
      - run: uv run mypy apps/api/src packages
      - run: uv run --package openlex-api pytest apps/api/tests packages -v
