# .github/workflows/integration.yml
name: integration

on:
  pull_request:
    paths:
      - "packages/legal_retrieval/**"
      - "packages/legal_parsing/**"
      - "packages/legal_models/**"
      - "packages/shared/**"
      - "pipelines/**"
      - "migrations/**"
      - "tests/integration/**"

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openlex_test
          POSTGRES_DB: openlex_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U openlex_test -d openlex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Same dummy values as api.yml/pipelines.yml -- openlex_shared.config.Settings requires
    # these at import time (database_url is a plain `str` field, not URL-validated, so any
    # non-empty string satisfies it); tests/integration never actually connects via
    # DATABASE_URL (it uses TEST_DATABASE_URL, see conftest.py) or makes a real Anthropic
    # call or reads JWT_SECRET_KEY, so placeholders are correct here. DATABASE_URL is
    # deliberately not written in user:pass@host URL shape -- that shape trips GitGuardian's
    # generic-password pattern matcher even though the value is never used to connect.
    env:
      ANTHROPIC_API_KEY: ci-placeholder
      DATABASE_URL: not-a-real-connection-string-see-comment-above
      JWT_SECRET_KEY: ci-placeholder-not-a-real-secret-32chars
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-packages

      - name: Apply migrations
        run: |
          for f in migrations/postgres/*.sql; do
            echo "Applying $f"
            PGPASSWORD="" psql -h localhost -p 5544 -U openlex_test -d openlex_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - run: uv run pytest tests/integration -v
