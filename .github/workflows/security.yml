name: security

on:
  pull_request:

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      # --no-emit-workspace: pip-audit scans third-party dependencies for known CVEs, not our
      # own first-party code -- and local workspace packages can't be hash-verified anyway
      # (pip refuses to `--require-hashes` a directory), which broke this job entirely before.
      - run: uv export --all-packages --no-dev --no-emit-workspace --format requirements-txt > requirements.audit.txt
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.audit.txt

  secret-scan:
    runs-on: ubuntu-latest
    # gitleaks-action calls the GitHub API to list the PR's commits for its diff scan; the
    # default GITHUB_TOKEN is read-only on contents only unless pull-requests read is granted
    # explicitly, which was causing a 403 "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
