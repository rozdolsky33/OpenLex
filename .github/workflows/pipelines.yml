name: pipelines

on:
  pull_request:
    paths:
      - "pipelines/**"
      - "apps/worker/**"
      - "packages/legal_parsing/**"
      - "packages/legal_models/**"
      - "packages/shared/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway CI config
        # openlex_shared.config.Settings requires these at import time (no .env exists in CI).
        # Tests here are all mock-based -- never used for a real Claude call, DB connection, or
        # token check. Generated at runtime rather than hardcoded so secret scanners
        # (gitleaks/GitGuardian) never see a secret-shaped literal in this file.
        run: |
          {
            echo "ANTHROPIC_API_KEY=ci-not-used"
            echo "DATABASE_URL=postgresql+asyncpg://ci-not-used/ci"
            echo "JWT_SECRET_KEY=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      # --all-packages, not --package openlex-worker: a package-scoped sync excludes the dev
      # group (ruff/mypy/pytest), which this job needs directly.
      - run: uv sync --all-packages
      - run: uv run ruff check pipelines apps/worker packages/legal_parsing packages/legal_models packages/shared
      - run: uv run mypy pipelines apps/worker/src packages/legal_parsing packages/legal_models packages/shared
      # apps/worker/tests doesn't exist yet (apps/worker has no test suite at all -- separate,
      # pre-existing gap, not introduced or fixed here).
      - run: uv run --package openlex-worker pytest packages/legal_parsing packages/legal_models packages/shared -v
