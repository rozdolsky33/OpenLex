name: pipelines

on:
  pull_request:
    paths:
      - "pipelines/**"
      - "apps/worker/**"
      - "packages/legal_parsing/**"
      - "packages/legal_models/**"
      - "packages/shared/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # openlex_shared.config.Settings requires these three at import time (no .env file exists
    # in CI). Tests here are all mock-based, so dummy values are correct -- never used for a
    # real Claude call or DB connection.
    env:
      ANTHROPIC_API_KEY: ci-placeholder
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      JWT_SECRET_KEY: ci-placeholder-not-a-real-secret-32chars
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      # --all-packages, not --package openlex-worker: a package-scoped sync excludes the dev
      # group (ruff/mypy/pytest), which this job needs directly.
      - run: uv sync --all-packages
      - run: uv run ruff check pipelines apps/worker packages/legal_parsing packages/legal_models packages/shared
      - run: uv run mypy pipelines apps/worker/src packages/legal_parsing packages/legal_models packages/shared
      # apps/worker/tests doesn't exist yet (apps/worker has no test suite at all -- separate,
      # pre-existing gap, not introduced or fixed here).
      - run: uv run --package openlex-worker pytest packages/legal_parsing packages/legal_models packages/shared -v
