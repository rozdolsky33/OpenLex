[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openlex-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "legal-models",
    "legal-retrieval",
    "legal-generation",
    "openlex-shared",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
]

[tool.uv.sources]
legal-models = { workspace = true }
legal-retrieval = { workspace = true }
legal-generation = { workspace = true }
openlex-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/openlex_api"]
