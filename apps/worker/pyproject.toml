[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openlex-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "sentence-transformers>=3.3.1",
    "torch>=2.5.1",
    "legal-models",
    "legal-parsing",
    "legal-retrieval",
    "openlex-shared",
]

[tool.uv.sources]
legal-models = { workspace = true }
legal-parsing = { workspace = true }
legal-retrieval = { workspace = true }
openlex-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/openlex_worker"]
