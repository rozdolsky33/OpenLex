[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-retrieval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "legal-models",
    "openlex-shared",
    "sentence-transformers>=5.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "torch>=2.13.0",
]

[tool.uv.sources]
legal-models = { workspace = true }
openlex-shared = { workspace = true }
# CPU-only build: embeddings run in-process on CPU (see ml/model_cards/bge-small-en-v1.5.md),
# no GPU anywhere in this project. Without this, uv resolves the default CUDA-enabled torch
# build on Linux, pulling multi-GB nvidia-* wheels that exhaust CI runner disk space.
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/legal_retrieval"]
