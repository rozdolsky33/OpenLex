[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-generation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "legal-models",
    "anthropic>=0.42.0",
    "legal-retrieval",
    "sqlalchemy[asyncio]>=2.0.36",
    "prometheus-client>=0.25.0",
    "opentelemetry-api>=1.43.0",
]

[tool.uv.sources]
legal-models = { workspace = true }
legal-retrieval = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/legal_generation"]
